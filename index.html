<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#050505'><meta http-equiv='Cache-Control' content='no-cache, no-store, must-revalidate'><meta http-equiv='Pragma' content='no-cache'><meta http-equiv='Expires' content='0'><title>WWE Superstars</title><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='apple-mobile-web-app-title' content='WWE Superstars'><link rel='apple-touch-icon' href='assets/wwe-superstars-icon.png?v=0.9.127'><link rel='icon' type='image/png' href='assets/wwe-superstars-icon.png?v=0.9.127'><style>.live-screen .live-play-button{appearance:none!important;display:block!important;box-sizing:border-box!important;width:100%!important;height:32px!important;min-height:32px!important;max-height:32px!important;padding:0 8px!important;margin:7px auto 0!important;border:1px solid #aaa!important;border-radius:4px!important;background:#ddd!important;color:#111!important;font:700 13px/30px Oswald,Impact,sans-serif!important;box-shadow:none!important;text-align:center!important}.live-screen .live-play-button:disabled{background:#34363b!important;color:#bbb!important}.live-screen .live-match{padding:5px 7px 6px!important}html,body{margin:0;min-height:100%;background:#050505}#app{min-height:100dvh;background:#050505}</style></head><body><main id='app'></main><script>
/* iOS Home Screen updater: check GitHub before loading any game assets. */
(async function(){
 const fallback='0.9.218', stamp=Date.now(), root=new URL('./',location.href);
 const manifestUrl=new URL('version.json',root);
 const raw='https://raw.githubusercontent.com/Swoop081/wwe-superstars/main/version.json';
 async function versionAt(url){
  const response=await fetch(url+(url.includes('?')?'&':'?')+'_='+stamp,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!response.ok)throw Error('Version fetch '+response.status);
  const value=String((await response.json()).version||'').trim();
  if(!/^\d+\.\d+\.\d+$/.test(value))throw Error('Invalid version');
  return value;
 }
 let version=fallback;
 // Check the deployed manifest first; raw main can be ahead of GitHub Pages.
 try{version=await Promise.race([versionAt(manifestUrl.href),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),2500))])}
 catch(e){try{version=await versionAt(raw)}catch(_){}}
 // Recheck whenever the PWA returns to the foreground, without deleting local saves.
 let lastCheck=Date.now();
 async function refreshIfUpdated(){
  if(document.visibilityState==='hidden'||Date.now()-lastCheck<15000)return;
  lastCheck=Date.now();
  try{const latest=await versionAt(manifestUrl.href);if(latest!==version){
   const u=new URL(location.href);u.searchParams.set('v',latest);u.searchParams.set('refresh',String(Date.now()));location.replace(u.href);
  }}catch(e){}
 }
 document.addEventListener('visibilitychange',refreshIfUpdated);
 window.addEventListener('pageshow',refreshIfUpdated);
 window.addEventListener('focus',refreshIfUpdated);
 function stylesheet(file){return new Promise(resolve=>{let l=document.createElement('link');l.rel='stylesheet';l.href=new URL(file+'?v='+encodeURIComponent(version)+'&t='+stamp,root).href;l.onload=resolve;l.onerror=resolve;document.head.appendChild(l)})}
 function script(file){return new Promise((resolve,reject)=>{let el=document.createElement('script');el.src=new URL(file+'?v='+encodeURIComponent(version)+'&t='+stamp,root).href;el.onload=resolve;el.onerror=()=>reject(Error('Unable to load '+file));document.body.appendChild(el)})}
 await Promise.all([stylesheet('style.css'),stylesheet('faction-warfare.css')]);
 try{await script('faction-warfare.js');await script('faction-warfare-ui.js');await script('app.js')}
 catch(error){document.getElementById('app').textContent='Unable to load the latest game. Check your connection and reopen the app.'}
})();
</script></body></html>
