name: Pre-release QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Run pre-release QA
        run: node tests/qa-static.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wwe-qa-server.log 2>&1 &
      - name: Run mobile browser smoke test
        run: node tests/qa-browser.cjs
