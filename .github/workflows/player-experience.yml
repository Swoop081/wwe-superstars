name: Player Experience Audit
on:
  push:
    paths:
      - 'tools/simulate_player_experience.cjs'
      - '.github/workflows/player-experience.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/simulate_player_experience.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: player-experience-results
          path: tools/player-experience-results.json
