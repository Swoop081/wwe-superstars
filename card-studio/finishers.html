<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WWE Superstars Finisher Studio</title><style>body{margin:0;background:#111827;color:#fff;font:16px system-ui}.wrap{max-width:1000px;margin:auto;padding:36px}h1{font-size:42px;margin:0 0 8px}.sub{color:#a9bad4;margin-bottom:28px}.row{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:center;margin:10px 0}.row b{font-size:15px}input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:9px;border:1px solid #41516c;background:#0b1220;color:#fff;font-size:15px}.actions{display:flex;gap:12px;margin-top:28px}button,a{padding:13px 20px;border:0;border-radius:9px;background:#2463c9;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}button{background:#e7193f}.note{margin-top:20px;padding:16px;background:#172033;border-radius:10px;color:#c8d5e8}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:22px}}</style></head><body><main class="wrap"><h1>Finisher Studio</h1><div class="sub">Paste the normal Tenor share/page URL for each Superstar's finishing clip. The game converts it automatically.</div><div id="rows"></div><div class="actions"><button id="export">EXPORT FINISHER DATA</button><a href="./">CARD STUDIO</a></div><div class="note">Export creates <b>finisher-media.json</b>. Put that file in the repository root. The game reads it automatically on every finishing screen.</div></main><script>const names=["Roman Reigns","Cody Rhodes","Rhea Ripley","CM Punk","IYO SKY","Seth Rollins","Becky Lynch","Randy Orton","Bianca Belair","Gunther","Sami Zayn","Charlotte Flair","Tiffany Stratton","Liv Morgan","Lola Vice","Stone Cold Steve Austin","The Rock","Triple H","The Undertaker","Shawn Michaels"];const rows=document.querySelector('#rows');names.forEach(n=>{let d=document.createElement('label');d.className='row';d.innerHTML='<b>'+n+'</b><input data-name="'+n+'" placeholder="Paste normal Tenor GIF link">';rows.appendChild(d)});document.querySelector('#export').onclick=()=>{let data={};document.querySelectorAll('input').forEach(i=>data[i.dataset.name]=i.value.trim());let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finisher-media.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></body></html>
