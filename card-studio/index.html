<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08060b"><title>WWE Superstars Card Studio</title><link rel="stylesheet" href="studio.css"></head><body><main class="studio"><header><div><span class="eyebrow">WWE SUPERSTARS</span><h1>Card Studio</h1></div><a href="../">Game</a></header><section class="controls"><label>SUPERSTAR<select id="superstar"></select></label><label class="upload">IMPORT PHOTO<input id="file" type="file" accept="image/*"></label><div class="range"><span>ZOOM</span><input id="zoom" type="range" min="1" max="3.5" value="1" step=".01"></div><p>Drag the image directly on the card to position it. The exported PNG contains artwork only; the game adds the live name, level, HP and stats.</p></section><section class="workspace"><canvas id="card" width="750" height="1100"></canvas><div class="actions"><button id="reset">RESET POSITION</button><button id="export">EXPORT PNG</button></div><div id="filename">assets/superstars/roman-reigns.png</div></section></main><script src="studio.js"></script></body></html>
